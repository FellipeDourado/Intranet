<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="../css/reset.css">
  <link rel="stylesheet" href="../css/senha.css">
  <link rel="stylesheet" href="../css/tema.css">

  <title>Recuperar senha | Krona Intranet</title>
</head>

<body>
  <button class="botao-tema" id="botao-tema" type="button">
  <img
    src="../assets/lua.png"
    alt="Alterar tema"
    id="icone-tema"
  >
</button>

  <main>
    <section class="senha-section">

      <img
  src="assets/Logotipo Preto.png"
  alt="Logo da Krona"
  class="logo"
  id="logo-krona">

      <h1>Esqueci minha senha</h1>

      <p>
        Informe seu usuário ou e-mail corporativo para iniciar a recuperação da sua senha.
      </p>

      <form class="form-senha">

        <label for="identificacao">
          Usuário ou e-mail corporativo
        </label>

        <input
          type="text"
          id="identificacao"
          name="identificacao"
          required
        >

        <button type="submit">
          Continuar
        </button>

        <a href="../index.html" class="voltar-login">
         ← Voltar para o login
        </a>

      </form>

    </section>
  </main>

  <footer class="direitos">
    <p>&copy; <span id="ano-atual"></span> Krona Intranet. Todos os direitos reservados.</p>
  </footer>

  <script src="../JS/scriptsenha.js"></script>
  <script src="../JS/tema.js"></script>

</body>

</html>
