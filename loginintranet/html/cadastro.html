<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="../css/reset.css">
  <link rel="stylesheet" href="../css/cadastro.css">
  <link rel="stylesheet" href="../css/tema.css">

  <title>Cadastro | Krona Intranet</title>
</head>

<body>

  <button class="botao-tema" id="botao-tema" type="button">
  <img
    src="../assets/lua.png"
    alt="Alterar tema"
    id="icone-tema"
  >
</button>
  <main>
    <section class="cadastro-section">
      <img
  src="assets/Logotipo Preto.png"
  alt="Logo da Krona"
  class="logo"
  id="logo-krona">
      
      <h1>Cadastro de usuário</h1>

      <p>
        Preencha os dados abaixo para criar seu acesso à Intranet Krona.
      </p>

      <form class="form-cadastro" action="" method="POST">

        <div class="grupo">
          <h2>Informações pessoais</h2>

          <label for="nome">Nome completo</label>
          <input
            type="text"
            id="nome"
            name="nome"
            required
          >

          <label for="email">E-mail corporativo</label>
          <input
            type="email"
            id="email"
            name="email"
            required
          >
        </div>

        <div class="grupo">
          <h2>Informações corporativas</h2>

          <label for="setor">Setor</label>
          <input
            type="text"
            id="setor"
            name="setor"
            required
          >

          <label for="cargo">Cargo</label>
          <input
            type="text"
            id="cargo"
            name="cargo"
            required
          >
        </div>

        <div class="grupo">
          <h2>Dados de acesso</h2>

          <label for="usuario">Usuário</label>
          <input
            type="text"
            id="usuario"
            name="usuario"
            required
          >

          <label for="senha">Senha</label>
          <input
            type="password"
            id="senha"
            name="senha"
            required
          >

          <label for="confirmar-senha">Confirmar senha</label>
          <input
            type="password"
            id="confirmar-senha"
            name="confirmar-senha"
            required
          >
        </div>

        <button type="submit">
          Criar cadastro
        </button>

        <a href="../index.html" class="voltar-login">
          ← Voltar para o login
        </a>

      </form>
    </section>
  </main>

  <footer class="direitos">
    <p>&copy; 2026 Krona Intranet. Todos os direitos reservados.</p>
  </footer>
  <script src="../JS/scriptcadastro.js"></script>
  <script src="../JS/tema.js"></script>
</body>

</html>
